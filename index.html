<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Life App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home" class="tab active">
    <h1>Today</h1>
    <input id="taskInput" placeholder="New task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
  </section>

  <section id="goals" class="tab"><h1>Goals</h1></section>
  <section id="habits" class="tab"><h1>Habits</h1></section>
  <section id="calendar" class="tab"><h1>Calendar</h1></section>
  <section id="settings" class="tab"><h1>Settings</h1></section>

  <nav>
    <button onclick="openTab('home')">🏠</button>
    <button onclick="openTab('goals')">🎯</button>
    <button onclick="openTab('habits')">🔥</button>
    <button onclick="openTab('calendar')">📅</button>
    <button onclick="openTab('settings')">⚙️</button>
  </nav>

  <script src="app.js"></script>
  
</body>
</html>
