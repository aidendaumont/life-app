<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Life App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home" class="tab active">
    <h1>Today</h1>
    <input id="taskInput" placeholder="New task">
    <select id="taskMode">
      <option value="today">Today only</option>
      <option value="untilDone">Until done</option>
      <option value="untilDeleted">Until deleted</option>
    </select>
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
  </section>

  <section id="goals" class="tab">
    <h1>Goals</h1>
    <input id="goalName" placeholder="Goal name">
    <input id="goalTarget" type="number" placeholder="Target number (e.g. 20)">
    <small>Deadline (optional)</small>
    <input id="goalDeadline" type="date">
    <button onclick="addGoal()">Add goal</button>
    <div id="goalList"></div>
  </section>
  <section id="habits" class="tab"><h1>Habits</h1></section>
  <section id="calendar" class="tab"><h1>Calendar</h1></section>
  <section id="settings" class="tab">
    <h1>Settings</h1>
    <label class="setting">
      <span>Second Brain</span>
      <input type="checkbox" switch id="brainToggle" onchange="toggleBrain()">
    </label>
  </section>

  <section id="brain" class="tab">
    <div class="brain-top">
      <button id="brainBack" onclick="zoomOut()">←</button>
      <span id="brainPath"></span>
      <button id="resetLayout" onclick="resetLayout()">Tidy</button>
    </div>
    <div id="bubbleFull"></div>
    <svg id="brainMap" viewBox="0 0 360 360"></svg>
    <div id="brainTips"></div>

    <input id="bubbleText" placeholder="New bubble">
    <div class="brain-add">
      <input id="bubbleText" placeholder="New bubble">
      <select id="bubbleType">
        <option value="goal">Goal</option>
        <option value="step">Step</option>
        <option value="note">Note</option>
      </select>
      <button onclick="addBubble()">+</button>
    </div>
    <button id="toolsToggle" onclick="toggleTools()">Bubble options</button>

    <div id="bubbleTools">
      <label class="setting">
        <span>Must do first</span>
        <select id="afterSelect" onchange="setAfter()"></select>
      </label>
      <label class="setting">
        <span>Must do after</span>
        <select id="beforeSelect" onchange="setBefore()"></select>
      </label>
      <label class="setting" id="centerLineRow">
        <span>Line to middle too</span>
        <input type="checkbox" switch id="centerLineToggle" onchange="toggleCenterLine()">
      </label>
      <button id="renameBubble" onclick="renameCenter()">Rename this bubble</button>
      <button id="deleteBubble" onclick="deleteBubble()">Delete this bubble</button>
    </div>
  </section>

  <nav>
    <button onclick="openTab('home')">🏠</button>
    <button onclick="openTab('goals')">🎯</button>
    <button onclick="openTab('habits')">🔥</button>
    <button onclick="openTab('calendar')">📅</button>
    <button onclick="openTab('settings')">⚙️</button>
    <button id="brainTab" onclick="openTab('brain')">🧠</button>
  </nav>

  <script src="app.js"></script>
  
</body>
</html>
